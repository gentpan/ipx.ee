# ─────────────────────────────────────────────────────────────
#  ip.bluecdn.com — Nginx 配置
#
#  DNS 设置:
#    ipv4.bluecdn.com  →  仅 A 记录（IPv4）
#    ipv6.bluecdn.com  →  仅 AAAA 记录（IPv6）
#    ip.bluecdn.com    →  A + AAAA 双栈
#
#  目录结构:
#    public/ipv4/index.php  ← ipv4.bluecdn.com webroot
#    public/ipv6/index.php  ← ipv6.bluecdn.com webroot
#    public/ip/index.php    ← ip.bluecdn.com webroot
# ─────────────────────────────────────────────────────────────

# ipv4.bluecdn.com — 仅监听 IPv4
server {
    listen      80;
    server_name ipv4.bluecdn.com;

    root  /path/to/ip.bluecdn.com/ipv4;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}

# ipv6.bluecdn.com — 仅监听 IPv6
server {
    listen      [::]:80 ipv6only=on;
    server_name ipv6.bluecdn.com;

    root  /path/to/ip.bluecdn.com/ipv6;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}

# ip.bluecdn.com — 双栈，含 /geoip 路由
server {
    listen      80;
    listen      [::]:80;
    server_name ip.bluecdn.com;

    root  /path/to/ip.bluecdn.com;
    index index.php;

    # 禁止直接访问 xdb 数据库文件
    location ~* \.xdb$ {
        deny all;
        return 404;
    }

    # Go API upstream
    location = /ip {
        proxy_pass http://127.0.0.1:18080/ip;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location = /jsonip {
        proxy_pass http://127.0.0.1:18080/jsonip$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location = /geoip {
        proxy_pass http://127.0.0.1:18080/geoip$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location ^~ /geoip/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # Other routes stay on PHP (home / api docs / about / contact ...)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
